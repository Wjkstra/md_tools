  <!-- 圆角底板 -->
  <rect x="0" y="0" width="1024" height="1024" rx="228" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="512" rx="228" fill="url(#sheen)"/>

  <!-- 白色几何 M -->
